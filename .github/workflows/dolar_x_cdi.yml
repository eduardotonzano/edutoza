name: Documento Dólar x CDI

# Gera o PDF "Dólar x CDI" (rentabilidade acumulada em 1/5/10/20 anos, com dados oficiais
# do Banco Central) e manda por e-mail. Roda sob demanda (Actions -> Run workflow), uma
# vez por mês (dia 1), ou disparado pelo formulário web (ver dolar_x_cdi/pedido_web/) —
# como as janelas são de médio/longo prazo, não faz sentido rodar todo dia como o monitor
# de notícias.
on:
  schedule:
    - cron: "0 12 1 * *"   # dia 1 de cada mês, 12:00 UTC (09:00 em Brasília)
  workflow_dispatch:
    inputs:
      spread:
        description: "Spread anual do 'CDI + X%' de referência (ex.: 0.04 para CDI + 4%)"
        required: false
        default: "0.04"
      spread_dolar:
        description: "Spread anual do 'Dólar + X%' de referência (ex.: 0.035 para Dólar + 3,5%)"
        required: false
        default: "0.035"
      email_destino:
        description: "E-mail de destino (deixe em branco pro padrão)"
        required: false
        default: ""
      data_fim:
        description: "Data final desejada para as janelas, AAAA-MM-DD (deixe em branco pro dado mais recente)"
        required: false
        default: ""
      preto_branco:
        description: "Gerar os gráficos em preto e branco (true/false)"
        required: false
        default: "false"

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dolar_x_cdi/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r dolar_x_cdi/requirements.txt

      # Data final desejada (vem do formulário web ou de quem roda manualmente); validada
      # aqui (formato AAAA-MM-DD) antes de ir pro passo de geração — em variável de ambiente,
      # não colada direto no script, pra não correr risco de injeção de comando vindo do
      # texto livre que chega pelo formulário público.
      - name: Validar data final desejada
        id: datafim
        env:
          DATA_BRUTA: ${{ github.event.inputs.data_fim }}
        run: |
          if echo "$DATA_BRUTA" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'; then
            echo "data=$DATA_BRUTA" >> "$GITHUB_OUTPUT"
          else
            echo "data=" >> "$GITHUB_OUTPUT"
          fi

      # Spreads dos "+X% a.a." (vêm do formulário web ou de quem roda manualmente);
      # validados aqui (número decimal entre 0 e 0,5, ou seja 0% a 50%) antes de ir
      # pro passo de geração, caindo no padrão se vier vazio, malformado ou fora da
      # faixa — mesmo cuidado do e-mail e da data, por ser texto livre vindo do
      # formulário público.
      - name: Validar spreads
        id: spreads
        env:
          SPREAD_BRUTO: ${{ github.event.inputs.spread }}
          SPREAD_DOLAR_BRUTO: ${{ github.event.inputs.spread_dolar }}
        run: |
          validar() {
            local valor="$1" padrao="$2"
            if echo "$valor" | grep -Eq '^[0-9]+(\.[0-9]+)?$' && awk -v v="$valor" 'BEGIN{exit !(v>=0 && v<=0.5)}'; then
              echo "$valor"
            else
              echo "$padrao"
            fi
          }
          echo "cdi=$(validar "$SPREAD_BRUTO" "0.04")" >> "$GITHUB_OUTPUT"
          echo "dolar=$(validar "$SPREAD_DOLAR_BRUTO" "0.035")" >> "$GITHUB_OUTPUT"

      - name: Gerar o documento (dados oficiais do Banco Central)
        working-directory: dolar_x_cdi
        env:
          SPREAD: ${{ steps.spreads.outputs.cdi }}
          SPREAD_DOLAR: ${{ steps.spreads.outputs.dolar }}
          DATA_FIM: ${{ steps.datafim.outputs.data }}
          PRETO_BRANCO: ${{ github.event.inputs.preto_branco }}
        run: |
          ARGS=(--spread "$SPREAD" --spread-dolar "$SPREAD_DOLAR")
          if [ -n "$DATA_FIM" ]; then
            ARGS+=(--data-fim "$DATA_FIM")
          fi
          if [ "$PRETO_BRANCO" = "true" ]; then
            ARGS+=(--pb)
          fi
          python gerar_documento.py "${ARGS[@]}"

      - name: Descobrir o nome do PDF gerado
        id: pdf
        run: echo "caminho=$(ls dolar_x_cdi/output/Dolar_x_CDI_*.pdf | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Publicar o PDF como artefato (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolar-x-cdi
          path: dolar_x_cdi/output/*.pdf
          retention-days: 90

      # O e-mail de destino vem do formulário web (dolar_x_cdi/pedido_web/) ou de quem
      # roda manualmente; validado aqui (formato simples) antes de ir pro passo de envio,
      # caindo no endereço padrão se vier vazio ou malformado.
      - name: Definir e-mail de destino
        id: destino
        env:
          EMAIL_BRUTO: ${{ github.event.inputs.email_destino }}
        run: |
          if echo "$EMAIL_BRUTO" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
            echo "email=$EMAIL_BRUTO" >> "$GITHUB_OUTPUT"
          else
            echo "email=eduardotonzano@gmail.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar por e-mail
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' }}
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Dólar x CDI - documento atualizado"
          to: ${{ steps.destino.outputs.email }}
          from: Dólar x CDI <${{ secrets.MAIL_USERNAME }}>
          body: |
            Segue em anexo o documento "Dólar x CDI" atualizado, com dados oficiais do
            Banco Central do Brasil (PTAX e CDI) para as janelas de 1, 5, 10 e 20 anos.
          attachments: ${{ steps.pdf.outputs.caminho }}
