name: Diagnóstico - CDI diário (SGS 12)

# Só investigação: verifica se a série SGS 12 do BCB é mesmo diária e se bate
# com a série 4391 (já em uso) quando composta por mês. NÃO gera PDF, NÃO
# manda e-mail — só imprime os dados nos logs desta execução, pra decidir com
# segurança se dá pra usar a 12 e deixar o CDI tão atualizado quanto o dólar.
on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dolar_x_cdi/requirements.txt

      - name: Instalar dependências
        run: pip install -r dolar_x_cdi/requirements.txt

      - name: Rodar diagnóstico
        working-directory: dolar_x_cdi
        run: python diagnostico_cdi_diario.py
